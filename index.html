<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/jpeg" href="favicon.jpeg">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            font-family: sans-serif;
        }

        /* Setup Menu Overlay */
        #setup-overlay {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .setup-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 35px;
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-width: 320px;
        }

        .link-btn {
            background-color: #ffffff;
            color: #000000;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 250px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 10px;
        }

        .link-btn:hover {
            transform: scale(1.03);
            background-color: #eeeeee;
        }
    </style>
</head>
<body>
    <!-- Setup Menu Overlay -->
    <div id="setup-overlay">
        <div class="setup-card">

            <a href="/portrait" target="_blank" rel="noopener noreferrer">
                <button class="link-btn">🖼️ Synced Portrait</button>
            </a>

            <a href="/full" target="_blank" rel="noopener noreferrer">
                <button class="link-btn">🎬 Synced Fullscreen</button>
            </a>

            <a href="/compilation" target="_blank" rel="noopener noreferrer">
                <button class="link-btn">🎞️ Compilation Maker</button>
            </a>

        </div>

        <div class="setup-card">

			<a href="/media" target="_blank" rel="noopener noreferrer">
                <button class="link-btn">📽️ Media Archive</button>
            </a>

            <a href="https://redgifs.com/" target="_blank" rel="noopener noreferrer">
                <button class="link-btn">🍑 Get More GIFs</button>
            </a>

        </div>
    </div>

    <script>
        const randStr = () => Math.random().toString(36).substring(2).toUpperCase();
	    document.title = `${randStr()}${randStr()}${randStr()}`;
    </script>
</body>
</html>
